
<html>
	<head>
		<title>
			class 13 demo
		</title>
		<!-- add meta tag to use vw and vh units -->
		<meta name="viewpoint" content="width=device-width" />
		<!-- add link tag -->
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<!-- ad p tag -->
		<p>
			this is a paragraph
		</p>
		<p>
			this is a second paragraph with the same style
		</p>
		<!-- add a p tag with a class attrib -->
		<!-- class names cannot have spaces -->
		<!-- any class attribute wih spaces
		will not count as multiple class names -->
		<p class="blue">
			this is blue paragraph
		</p>
		<h1 class="blue">
			this is a blue blue blue blablabla
		</h1>


		<!-- generic inline group -->
		<span class="big purple">
			this is a big purple span
		</span>
		<span class=" urple">
			this is a purple span
		</span>
		<span class="big">
			this is a big span
		</span>

		<!-- you can only use a single id name ONCE -->
		<p id="important">
			this is important paragraph!
		</p>


	</body>
</html>
